<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <radialGradient id="chestGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <circle cx="256" cy="270" r="180" fill="url(#chestGlow)" />
  <!-- Submarine / Ocean wave bubbles -->
  <circle cx="120" cy="140" r="18" fill="#ffffff" opacity="0.3"/>
  <circle cx="390" cy="110" r="24" fill="#ffffff" opacity="0.25"/>
  <circle cx="430" cy="180" r="14" fill="#ffffff" opacity="0.35"/>
  <circle cx="90" cy="380" r="12" fill="#ffffff" opacity="0.2"/>
  <!-- Treasure Chest Base -->
  <path d="M136 260 h240 v120 c0 20 -16 36 -36 36 H172 c-20 0 -36 -16 -36 -36 Z" fill="#92400e" stroke="#d97706" stroke-width="12"/>
  <!-- Chest Lid -->
  <path d="M120 250 C120 180 392 180 392 250 Z" fill="#b45309" stroke="#f59e0b" stroke-width="12"/>
  <!-- Chest Gold Trim -->
  <rect x="220" y="240" width="72" height="60" rx="10" fill="#fbbf24" stroke="#d97706" stroke-width="6"/>
  <circle cx="256" cy="265" r="8" fill="#78350f"/>
  <rect x="252" y="265" width="8" height="18" fill="#78350f"/>
  <!-- Math Symbols floating out -->
  <text x="210" y="160" font-family="Arial, sans-serif" font-weight="900" font-size="64" fill="#38bdf8" text-anchor="middle">+</text>
  <text x="310" y="150" font-family="Arial, sans-serif" font-weight="900" font-size="64" fill="#f43f5e" text-anchor="middle">×</text>
  <text x="256" y="115" font-family="Arial, sans-serif" font-weight="900" font-size="56" fill="#fbbf24" text-anchor="middle">÷</text>
  <!-- Little playful clownfish -->
  <path d="M370 330 Q420 310 400 350 Q390 380 350 350 Z" fill="#f97316"/>
  <circle cx="365" cy="336" r="4" fill="#ffffff"/>
  <circle cx="366" cy="336" r="2" fill="#000000"/>
</svg>
